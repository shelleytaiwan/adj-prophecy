<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>擲筊占卜感受</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --wood:#2b160f;
  --wood-2:#1b0d08;
  --temple-red:#6e1423;
  --vermilion:#b81d24;
  --gold:#d4af37;
  --gold-soft:#e8cf8a;
  --parchment:#f5e6c8;
  --ink:#241209;
  --shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse at 50% -10%, #3a1712 0%, transparent 60%),
    radial-gradient(ellipse at 10% 100%, #1a0a06 0%, transparent 50%),
    linear-gradient(180deg, var(--wood-2) 0%, var(--wood) 45%, #170b06 100%);
  font-family:"Noto Sans TC", sans-serif;
  color:var(--parchment);
  padding:28px 14px 60px;
  position:relative;
  overflow-x:hidden;
}
/* incense smoke */
.smoke{
  position:absolute; top:0; left:50%; width:2px; height:140px;
  background:linear-gradient(180deg, rgba(232,207,138,0) 0%, rgba(232,207,138,.35) 40%, rgba(232,207,138,0) 100%);
  filter:blur(6px);
  transform:translateX(-50%);
  animation:drift 6s ease-in-out infinite;
  pointer-events:none;
}
@keyframes drift{
  0%{opacity:.15; transform:translateX(-50%) translateY(0) scaleX(1);}
  50%{opacity:.5; transform:translateX(-38%) translateY(-60px) scaleX(2.4);}
  100%{opacity:0; transform:translateX(-20%) translateY(-140px) scaleX(4);}
}
.wrap{max-width:640px; margin:0 auto; position:relative; z-index:1;}

/* header */
header{text-align:center; margin-bottom:30px;}
.lantern-row{font-size:26px; letter-spacing:22px; opacity:.85; margin-bottom:4px;}
h1{
  font-family:"Noto Serif TC", serif;
  font-weight:900;
  font-size:clamp(28px,7vw,42px);
  margin:6px 0 4px;
  color:var(--gold-soft);
  text-shadow:0 2px 0 #000, 0 0 22px rgba(212,175,55,.35);
  letter-spacing:.06em;
}
.sub{
  font-size:13px; letter-spacing:.32em; color:var(--gold);
  text-transform:uppercase; opacity:.75;
}
.divider{
  width:120px; height:2px; margin:16px auto 0;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
}

/* step cards */
.step{
  background:linear-gradient(180deg, #3a1e14 0%, #241109 100%);
  border:1px solid rgba(212,175,55,.35);
  border-radius:4px;
  padding:20px 20px 22px;
  margin-bottom:18px;
  position:relative;
  box-shadow:0 10px 26px var(--shadow), inset 0 0 0 1px rgba(0,0,0,.3);
  transition:opacity .35s ease, filter .35s ease;
}
.step::before, .step::after{
  content:""; position:absolute; width:9px; height:9px; border:1px solid var(--gold); opacity:.6;
}
.step::before{top:6px; left:6px; border-right:none; border-bottom:none;}
.step::after{bottom:6px; right:6px; border-left:none; border-top:none;}
.step.locked{opacity:.42; filter:grayscale(.5); pointer-events:none;}
.step-head{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
.step-num{
  font-family:"Noto Serif TC", serif; font-weight:900; font-size:15px;
  width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 35% 30%, #e8cf8a, #b8902f 70%, #7a5f1c);
  color:#2b1608;
  box-shadow:0 2px 6px rgba(0,0,0,.5);
  flex-shrink:0;
}
.step-title{font-family:"Noto Serif TC", serif; font-weight:700; font-size:24px; color:var(--gold-soft);}
.step-desc{font-size:15px; color:#d8c5a4; opacity:.8; margin-top:2px;}

.btn{
  font-family:"Noto Serif TC", serif;
  font-weight:700;
  font-size:19px;
  border:1px solid var(--gold);
  background:linear-gradient(180deg, var(--vermilion), #7a1018);
  color:var(--gold-soft);
  padding:12px 22px;
  border-radius:3px;
  cursor:pointer;
  letter-spacing:.08em;
  box-shadow:0 4px 0 #4a0c10, 0 8px 14px rgba(0,0,0,.4);
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 #4a0c10, 0 4px 8px rgba(0,0,0,.4);}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn.ghost{
  background:transparent; color:var(--gold-soft); box-shadow:none; border:1px solid rgba(212,175,55,.5);
}

.chip-grid{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px;}
.chip{
  border:1px solid rgba(212,175,55,.55);
  background:rgba(212,175,55,.06);
  color:var(--parchment);
  padding:10px 18px;
  border-radius:22px;
  font-size:17px;
  cursor:pointer;
  transition:background .15s, transform .1s;
}
.chip:hover{background:rgba(212,175,55,.22);}
.chip:active{transform:scale(.96);}

.picked{
  display:inline-flex; align-items:center; gap:8px;
  margin-top:14px; padding:10px 20px;
  background:rgba(212,175,55,.12);
  border:1px solid var(--gold);
  border-radius:22px;
  font-family:"Noto Serif TC", serif; font-weight:700; font-size:20px;
  color:var(--gold-soft);
}
.picked .tag{font-size:12px; letter-spacing:.15em; color:#d8c5a4; opacity:.7; font-family:"Noto Sans TC",sans-serif; font-weight:400;}

/* jiaobei toss zone */
.toss-zone{display:flex; flex-direction:column; align-items:center; gap:18px; margin-top:8px;}
.coins{display:flex; gap:14px; height:130px; align-items:center; justify-content:center;}
.coin{width:78px; height:100px; position:relative; transform-origin:center;}
.coin.a{transform:rotate(-12deg);}
.coin.b{transform:rotate(184deg);}
.coin svg{width:100%; height:100%; display:block; filter:drop-shadow(0 5px 8px rgba(0,0,0,.55));}
.coin.tossing{animation:toss 1.1s cubic-bezier(.34,1.4,.4,1) 1;}
.coin.tossing.b{animation-delay:.06s;}
@keyframes toss{
  0%{transform:translateY(0) rotate(0deg);}
  30%{transform:translateY(-90px) rotate(340deg);}
  55%{transform:translateY(-50px) rotate(620deg);}
  100%{transform:translateY(0) rotate(1080deg);}
}

.sentence-box{
  margin-top:18px; padding:20px; border-radius:4px;
  background:linear-gradient(180deg, rgba(212,175,55,.08), rgba(212,175,55,.02));
  border:1px dashed rgba(212,175,55,.5);
  text-align:center;
  min-height:40px;
}
.sentence{
  font-family:"Noto Serif TC", serif; font-weight:700;
  font-size:clamp(26px,7.2vw,40px);
  color:var(--parchment);
  line-height:1.6;
}
.sentence .hl{color:var(--gold-soft);}
.annot{font-size:15px; color:#c9b489; margin-top:10px; font-style:italic; opacity:.9;}

.result-row{display:flex; align-items:center; justify-content:center; gap:18px; margin-top:18px; flex-wrap:wrap;}
.stamp{
  font-family:"Noto Serif TC", serif; font-weight:900; font-size:30px;
  width:104px; height:104px; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  border:4px solid currentColor; transform:rotate(-6deg);
  letter-spacing:.1em;
  writing-mode:vertical-rl;
  box-shadow:0 0 0 2px rgba(0,0,0,.25) inset;
  flex-shrink:0;
}
.stamp.sheng{color:#ffd75e; text-shadow:0 0 10px rgba(255,215,94,.5);}
.stamp.xiao{color:#ff9a52; text-shadow:0 0 10px rgba(255,154,82,.5);}
.stamp.yin{color:#8fa3c9; text-shadow:0 0 10px rgba(143,163,201,.4);}
.result-comment{max-width:340px; font-size:17px; color:#e6d5ac; text-align:left; line-height:1.6;}
.result-comment b{color:var(--gold-soft); font-family:"Noto Serif TC",serif; font-size:19px;}

.progress{display:flex; align-items:center; justify-content:center; gap:7px; margin-top:18px; font-size:14px; color:#c9b489;}
.dot{width:11px; height:11px; border-radius:50%; background:rgba(212,175,55,.25); border:1px solid rgba(212,175,55,.5);}
.dot.done{background:var(--gold);}
.dot.sheng-mark{background:#ffd75e; box-shadow:0 0 6px #ffd75e;}

.controls-row{display:flex; justify-content:center; gap:10px; margin-top:18px; flex-wrap:wrap;}

.judge-box{margin-top:22px; text-align:center;}
.judge-q{font-family:"Noto Serif TC",serif; font-weight:700; font-size:22px; color:var(--gold-soft); margin-bottom:14px; letter-spacing:.06em;}
.judge-btns{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
.judge-btn{
  font-family:"Noto Serif TC",serif; cursor:pointer;
  min-width:128px; padding:12px 14px; border-radius:8px;
  background:rgba(0,0,0,.25); border:2px solid currentColor;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  transition:transform .1s, background .15s;
}
.judge-btn b{font-size:26px; font-weight:900; letter-spacing:.1em;}
.judge-btn span{font-family:"Noto Sans TC",sans-serif; font-size:13px; color:#d8c5a4; opacity:.9;}
.judge-btn:hover{background:rgba(255,255,255,.08);}
.judge-btn:active{transform:scale(.96);}
.judge-btn.sheng{color:#ffd75e;}
.judge-btn.xiao{color:#ff9a52;}
.judge-btn.yin{color:#8fa3c9;}

.final-box{
  margin-top:26px; padding:26px 20px; border-radius:4px; text-align:center;
  background:linear-gradient(180deg, rgba(212,175,55,.14), rgba(212,175,55,.04));
  border:2px solid var(--gold);
}
.final-box h3{font-family:"Noto Serif TC",serif; font-size:22px; color:var(--gold-soft); margin:0 0 16px; letter-spacing:.12em;}
.tally{display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-bottom:18px;}
.tally-item{min-width:92px; padding:10px 8px; border:2px solid currentColor; border-radius:8px; font-family:"Noto Serif TC",serif;}
.tally-item .tn{font-size:18px; font-weight:700;}
.tally-item .tc{font-size:34px; font-weight:900; line-height:1.2;}
.tally-item.sheng{color:#ffd75e;} .tally-item.xiao{color:#ff9a52;} .tally-item.yin{color:#8fa3c9;}
.final-comment{font-family:"Noto Serif TC",serif; font-weight:900; font-size:clamp(24px,6vw,32px); color:var(--parchment); line-height:1.6; margin:6px 0 20px;}

.hl{position:relative; display:inline-block; cursor:help; color:var(--gold-soft); border-bottom:2px dotted var(--gold); outline:none; -webkit-tap-highlight-color:transparent;}
.pop{
  display:none; position:absolute; top:100%; left:50%; margin-top:10px; z-index:30;
  width:max-content; max-width:min(300px,78vw); padding:12px 16px; text-align:left;
  background:#1b0d08; border:1px solid var(--gold); border-radius:6px;
  box-shadow:0 8px 22px rgba(0,0,0,.65);
  font-family:"Noto Sans TC",sans-serif; font-weight:400; font-style:normal; letter-spacing:0; line-height:1.55;
  color:var(--parchment); font-size:16px; white-space:normal;
}
.hl:hover .pop, .hl:focus .pop, .hl.open .pop{display:block;}
.pop .pw{font-family:"Noto Serif TC",serif; font-weight:700; color:var(--gold-soft); font-size:18px;}
.pop .pr{font-size:15px; margin-top:4px;}
.pop .pr i{font-style:normal; display:inline-block; min-width:2.2em; margin-right:6px; padding:0 6px; border-radius:8px; background:rgba(212,175,55,.2); color:var(--gold-soft); font-size:12px;}
.pop .pe{margin-top:8px; padding-top:8px; border-top:1px dashed rgba(212,175,55,.45); font-family:"Noto Serif TC",serif; font-size:17px; color:var(--parchment);}

.history{margin-top:6px;}
.history h3{font-family:"Noto Serif TC",serif; font-size:17px; color:var(--gold); text-align:center; margin:0 0 12px; letter-spacing:.1em;}
.history-item{
  display:flex; justify-content:space-between; gap:10px; align-items:center;
  padding:11px 12px; border-bottom:1px solid rgba(212,175,55,.15);
  font-size:16px; color:#dcc9a4;
}
.history-item .hs{font-family:"Noto Serif TC",serif;}
.history-item .hr{font-size:13px; padding:3px 10px; border-radius:10px; border:1px solid currentColor; flex-shrink:0;}
.hr.sheng{color:#ffd75e;} .hr.xiao{color:#ff9a52;} .hr.yin{color:#8fa3c9;}

footer{text-align:center; margin-top:34px; font-size:11px; letter-spacing:.15em; color:rgba(232,207,138,.4);}

@media (prefers-reduced-motion: reduce){
  .smoke, .coin.tossing{animation:none;}
}
</style>
</head>
<body>

<div class="smoke" style="left:38%; animation-delay:0s;"></div>
<div class="smoke" style="left:62%; animation-delay:2s;"></div>


<div class="wrap">
  <header>
    <div class="lantern-row">🏮 🏮 🏮</div>
    <h1>擲筊占卜感受</h1>
    <div class="divider"></div>
  </header>

  <!-- STEP 1 -->
  <div class="step" id="step1">
    <div class="step-head">
      <div class="step-num">一</div>
      <div>
        <div class="step-title">問事</div>
        <div class="step-desc">選主題</div>
      </div>
    </div>
    <button class="btn" id="btnAsk">🙏 問事</button>
    <div class="chip-grid" id="catGrid" style="display:none;"></div>
    <div id="pickedSubject"></div>
  </div>

  <!-- STEP 2 -->
  <div class="step locked" id="step2">
    <div class="step-head">
      <div class="step-num">二</div>
      <div>
        <div class="step-title">程度</div>
        <div class="step-desc">表達感受的程度</div>
      </div>
    </div>
    <button class="btn" id="btnLevel">📿 選程度</button>
    <div class="chip-grid" id="levelGrid" style="display:none;"></div>
    <div id="pickedLevel"></div>
  </div>

  <!-- STEP 3 -->
  <div class="step locked" id="step3">
    <div class="step-head">
      <div class="step-num">三</div>
      <div>
        <div class="step-title">擲筊</div>
        <div class="step-desc">占卜你的感受</div>
      </div>
    </div>
    <div class="toss-zone">
      <div class="coins" id="coins">
        <div class="coin a" id="coinA"></div>
        <div class="coin b" id="coinB"></div>
      </div>
      <button class="btn" id="btnToss">🎲 擲筊</button>
    </div>

    <div class="sentence-box" id="sentenceBox" style="display:none;">
      <div class="sentence" id="sentenceText"></div>
      <div class="annot" id="annotText"></div>
    </div>

    <div class="judge-box" id="judgeBox" style="display:none;">
      <div class="judge-q">你覺得你得到什麼杯？</div>
      <div class="judge-btns">
        <button class="judge-btn sheng" data-k="sheng"><b>聖杯</b><span>很自然、很正確</span></button>
        <button class="judge-btn xiao" data-k="xiao"><b>笑杯</b><span>很好笑、很有趣</span></button>
        <button class="judge-btn yin" data-k="yin"><b>陰杯</b><span>怪怪的、不通順</span></button>
      </div>
    </div>

    <div class="result-row" id="resultRow" style="display:none;"></div>

    <div class="progress" id="progress"></div>

    <div class="controls-row" id="controlsRow" style="display:none;">
      <button class="btn ghost" id="btnAgain">🔁 再擲一次（重選主題）</button>
      <button class="btn ghost" id="btnSpeak">🔊 再唸一次</button>
      <button class="btn" id="btnFinish">🏁 結束（看今日評語）</button>
    </div>
  </div>

  <div class="history" id="historyBox" style="display:none;">
    <h3>─ 本次紀錄 ─</h3>
    <div id="historyList"></div>
  </div>

  <div class="final-box" id="finalBox" style="display:none;">
    <h3>— 今日擲筊結果 —</h3>
    <div class="tally" id="tally"></div>
    <div class="final-comment" id="finalComment"></div>
    <button class="btn ghost" id="btnRestart">🔄 重新開始</button>
  </div>

  <footer>Shelleytaiwan 使用 AI 製作 2026</footer>
  <div style="text-align:center;font-size:12px;color:#8a7a6a;opacity:0.8;margin-top:4px;">聖杯、笑杯、陰杯由你自己判斷；不確定句子對不對，請問老師</div>
</div>

  usedInCat:{}, usedAdj:[],
  counts:{sheng:0,xiao:0,yin:0}, pending:false,
  history:[]
};
Object.keys(categories).forEach(c=>state.usedInCat[c]=[]);

function drawFromPool(pool, usedArr){
  let avail = pool.filter(x=>!usedArr.includes(x));
  if(avail.length===0){ usedArr.length=0; avail = pool.slice(); }
  const pick = avail[Math.floor(Math.random()*avail.length)];
  usedArr.push(pick);
  return pick;
}

  const chip = document.createElement('div');

  chip.onclick=()=>chooseCategory(cat);
  catGrid.appendChild(chip);
});

btnAsk.onclick=()=>{ catGrid.style.display = catGrid.style.display==='none' ? 'flex':'none'; };

function chooseCategory(cat){
  state.category = cat;
  state.subject = drawFromPool(categories[cat], state.usedInCat[cat]);
  catGrid.style.display='none';
  pickedSubject.innerHTML = `<div class="picked">🎋 ${state.subject}<span class="tag">來自「${cat}」</span></div>`;
  step2.classList.remove('locked');
  resetStep3UIForNewSubject();
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// 形容詞加上滑鼠靠近／點一下就會 popup 的字典（不會念出聲）
function adjHTML(adj){
  const e = adjDict[adj.w];
  if(!e) return `<span class="hl">${adj.w}</span>`;
  const py = adj.py ? `<span style="opacity:.75;font-size:14px;"> ${esc(adj.py)}</span>` : '';
  return `<span class="hl" tabindex="0">${adj.w}<span class="pop">
    <div class="pw">${adj.w}${py}</div>
    <div class="pr"><i>EN</i>${esc(e[0])}</div>
    <div class="pr"><i>日</i>${esc(e[1])}</div>
    <div class="pe">${esc(e[2])}</div></span></span>`;
}

function buildSentenceHTML(subject, av, adj){
  const h = adjHTML(adj);
  switch(av.type){
    case 'wrap_le': return `${subject}太${h}了`;
    case 'suffix_jile': return `${subject}${h}極了`;
    case 'wrap_de': return `${subject}${av.ch}${h}的`;
    default: return `${subject}${av.t}${h}`;
  }
}

function placePop(hl){
  const pop = hl.querySelector('.pop'); if(!pop) return;
  pop.style.transform = 'translateX(-50%)';
  const r = pop.getBoundingClientRect();
  const margin = 8; let dx = 0;
  if(r.left < margin) dx = margin - r.left;
  else if(r.right > window.innerWidth - margin) dx = (window.innerWidth - margin) - r.right;
  pop.style.transform = `translateX(calc(-50% + ${dx}px))`;
}

function buildSentence(subject, av, adj){
  let core, spokenAdjPart = adj.w;
  switch(av.type){
    case 'wrap_le': core = `${subject}太${adj.w}了`; break;
    case 'suffix_jile': core = `${subject}${adj.w}極了`; break;
    case 'wrap_de': core = `${subject}${av.ch}${adj.w}的`; break;
    default: core = `${subject}${av.t}${adj.w}`; break;
  }
  return core;
}

function speakSlow(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW';
  u.rate = 0.62;
  u.pitch = 1;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(v=>v.lang==='zh-TW') || voices.find(v=>v.lang && v.lang.startsWith('zh'));
  if(v) u.voice = v;
  window.speechSynthesis.speak(u);
}

btnToss.onclick=()=>{
  if(state.pending) return;
  btnToss.disabled = true;
  playTossSound();
  coinA.classList.add('tossing','a');
  coinB.classList.add('tossing','b');
  sentenceBox.style.display='none';
  resultRow.style.display='none';
  judgeBox.style.display='none';
  controlsRow.style.display='none';

  setTimeout(()=>{
    coinA.classList.remove('tossing');
    coinB.classList.remove('tossing');

    // 選形容詞
    let pool = adjectives;
    if(state.adverbToken.neg) pool = adjectives.filter(a=>a.neg);
    const adj = drawFromPool(pool.map(a=>a.w), state.usedAdj);
    const adjObj = adjectives.find(a=>a.w===adj);
    const sentence = buildSentence(state.subject, state.adverbToken, adjObj);

    // 顯示句子
    sentenceText.innerHTML = buildSentenceHTML(state.subject, state.adverbToken, adjObj);
    let annot = '';
    if(adjObj.py) annot = `本句形容詞：${adjObj.w}　${adjObj.py}（${adjObj.jp}）`;
    annotText.textContent = annot;
    sentenceBox.style.display='block';

    lastSpokenText = sentence;
    state.currentSentence = sentence;
    speakSlow(sentence);

    // 念完後，請學生自己判斷是哪一種杯
    setTimeout(()=>{
      state.pending = true;
      judgeBox.style.display='block';
      controlsRow.style.display='flex';
      btnAgain.disabled = true;
      btnFinish.disabled = true;
    }, 700);

  }, 1150);
};

  const was = h.classList.contains('open');
  document.querySelectorAll('.hl.open').forEach(x=>x.classList.remove('open'));
  if(!was){ h.classList.add('open'); placePop(h); }
  e.stopPropagation();
});
document.addEventListener('click', ()=>{ document.querySelectorAll('.hl.open').forEach(x=>x.classList.remove('open')); });

// 學生自己判斷
document.querySelectorAll('.judge-btn').forEach(b=>{
  b.onclick=()=>{
    if(!state.pending) return;
    const k = b.dataset.k;
    const meta = outcomeMeta[k];
    state.pending = false;
    state.counts[k]++;
    state.history.unshift({s:state.currentSentence, r:meta.cls, label:meta.title});

    judgeBox.style.display='none';
    resultRow.innerHTML = `
      <div class="stamp ${meta.cls}">${meta.title}</div>
      <div class="result-comment"><b>${meta.title}</b><br>${meta.desc}</div>
    `;
    resultRow.style.display='flex';
    renderProgress();
    renderHistory();

    btnToss.disabled = false;
    btnAgain.disabled = false;
    btnFinish.disabled = false;
  };
});

// 結束：依各杯次數給最後評語
function finalMessages(c){
  const max = Math.max(c.sheng, c.xiao, c.yin);
  const tops = ['sheng','xiao','yin'].filter(k=>c[k]===max);
  const msg = {sheng:'你今天運氣很好哦！', xiao:'很好笑、很開心吧？', yin:'加油，運氣會變好的！'};
  if(tops.length===3) return ['聖杯、笑杯、陰杯一樣多，今天什麼運氣都體驗到了！'];
  return tops.map(k=>msg[k]);
}

btnFinish.onclick=()=>{
  if(state.pending || state.history.length===0) return;
  const c = state.counts;
  tallyEl.innerHTML = ['sheng','xiao','yin'].map(k=>
    `<div class="tally-item ${k}"><div class="tn">${outcomeMeta[k].title}</div><div class="tc">${c[k]}</div></div>`
  ).join('');
  finalComment.innerHTML = finalMessages(c).join('<br>');
  finalBox.style.display='block';
  btnToss.disabled = true;
  btnAgain.disabled = true;
  btnFinish.disabled = true;
  finalBox.scrollIntoView({behavior:'smooth', block:'center'});
};

btnRestart.onclick=()=>{
  state.counts = {sheng:0,xiao:0,yin:0};
  state.history = [];
  state.pending = false;
  finalBox.style.display='none';
  btnToss.disabled = false;
  btnAgain.disabled = false;
  btnFinish.disabled = false;
  btnAgain.onclick();
  renderProgress();
  renderHistory();
  window.scrollTo({top:0, behavior:'smooth'});
};

btnSpeak.onclick=()=>{ if(lastSpokenText) speakSlow(lastSpokenText); };

btnAgain.onclick=()=>{
  state.category=null; state.subject=null; state.adverbToken=null;
  pickedSubject.innerHTML=''; pickedLevel.innerHTML='';
  step2.classList.add('locked'); step3.classList.add('locked');
  sentenceBox.style.display='none'; resultRow.style.display='none'; controlsRow.style.display='none'; judgeBox.style.display='none';
};

function resetStep3UIForNewSubject(){
  step3.classList.add('locked');
  pickedLevel.innerHTML='';
  sentenceBox.style.display='none';
  resultRow.style.display='none';
  controlsRow.style.display='none';
  judgeBox.style.display='none';
}

// preload voices for speechSynthesis
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = ()=>{ window.speechSynthesis.getVoices(); };
}
</script>
</body>
